<!DOCTYPE html>
<html>

<head>

    <title>HR Login</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #141e30,
                #243b55
            );

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {

            background: white;

            padding: 40px;

            width: 350px;

            border-radius: 15px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);

            text-align: center;
        }

        h1 {

            color: #243b55;

            margin-bottom: 30px;
        }

        .subtitle {

            color: gray;

            margin-bottom: 25px;
        }

        input {

            width: 90%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        button {

            width: 100%;

            padding: 12px;

            background: #243b55;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: #141e30;

            transform: scale(1.03);
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>HR Login</h1>

        <p class="subtitle">

            AI Resume Screening Dashboard

        </p>

        <form action="/hr-dashboard"
              method="GET">

            <input type="text"
                   placeholder="Enter HR Username"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</body>

</html>
