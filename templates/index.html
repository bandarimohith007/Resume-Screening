<!DOCTYPE html>
<html>

<head>

    <title>AI Resume Screening</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364
            );

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-container {

            background: white;

            padding: 50px;

            width: 500px;

            border-radius: 20px;

            box-shadow: 0px 0px 25px rgba(0,0,0,0.3);

            text-align: center;
        }

        h1 {

            color: #203a43;

            margin-bottom: 20px;

            font-size: 36px;
        }

        .subtitle {

            color: gray;

            margin-bottom: 40px;

            line-height: 1.5;
        }

        .btn {

            width: 100%;

            padding: 15px;

            margin-bottom: 20px;

            border: none;

            border-radius: 10px;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

            color: white;
        }

        .hr-btn {

            background: #243b55;
        }

        .hr-btn:hover {

            background: #141e30;

            transform: scale(1.03);
        }

        .candidate-btn {

            background: #2a5298;
        }

        .candidate-btn:hover {

            background: #1e3c72;

            transform: scale(1.03);
        }

        a {

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="home-container">

        <h1>

            AI Resume Screening System

        </h1>

        <p class="subtitle">

            Smart AI-powered Resume Analyzer for
            Candidates and HR Professionals.

        </p>

        <a href="/hr-login">

            <button class="btn hr-btn">

                HR Login

            </button>

        </a>

        <a href="/candidate-login">

            <button class="btn candidate-btn">

                Candidate Login

            </button>

        </a>

    </div>

</body>

</html>
