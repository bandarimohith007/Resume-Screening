<!DOCTYPE html>
<html>

<head>

    <title>Upload Resume</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #1e3c72,
                #2a5298
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .upload-card {

            background: white;

            width: 450px;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);

            text-align: center;
        }

        h1 {

            color: #1e3c72;

            margin-bottom: 20px;
        }

        .subtitle {

            color: gray;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        input[type=file] {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 10px;

            background: #f5f5f5;

            margin-bottom: 25px;
        }

        button {

            width: 100%;

            padding: 14px;

            background: #2a5298;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: #1e3c72;

            transform: scale(1.03);
        }

    </style>

</head>

<body>

    <div class="upload-card">

        <h1>Upload Resume</h1>

        <p class="subtitle">

            Upload your resume PDF and get
            AI-powered ATS analysis instantly.

        </p>

        <form action="/results"
              method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="resume"
                   required>

            <button type="submit">

                Upload Resume

            </button>

        </form>

    </div>

</body>

</html>
