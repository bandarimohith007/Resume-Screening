<!DOCTYPE html>
<html>

<head>

    <title>Candidate Dashboard</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #1e3c72,
                #2a5298
            );

            min-height: 100vh;
        }

        .navbar {

            background: rgba(0,0,0,0.2);

            padding: 20px;

            color: white;

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            box-shadow: 0px 2px 10px rgba(0,0,0,0.2);
        }

        .dashboard-container {

            display: flex;

            justify-content: center;

            align-items: center;

            margin-top: 80px;
        }

        .dashboard-card {

            background: white;

            width: 450px;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);

            text-align: center;
        }

        h2 {

            color: #1e3c72;

            margin-bottom: 30px;
        }

        input[type=file] {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            border: 1px solid #ccc;

            margin-bottom: 25px;

            background: #f5f5f5;
        }

        button {

            width: 100%;

            padding: 14px;

            background: #2a5298;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: #1e3c72;

            transform: scale(1.03);
        }

        .info-text {

            color: gray;

            margin-bottom: 30px;
        }

    </style>

</head>

<body>

    <div class="navbar">

        Candidate Dashboard

    </div>

    <div class="dashboard-container">

        <div class="dashboard-card">

            <h2>Upload Your Resume</h2>

            <p class="info-text">

                Upload your PDF resume and get AI-powered ATS analysis instantly.

            </p>

            <form action="/results"
                  method="POST"
                  enctype="multipart/form-data">

                <input type="file"
                       name="resume"
                       required>

                <button type="submit">

                    Analyze Resume

                </button>

            </form>

        </div>

    </div>

</body>

</html>
